name: build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    # --- WINDOWS BAĞIMLILIKLARI ---
    - if: startsWith(matrix.os, 'windows')
      name: Install Dependencies (Windows)
      run: |
        vcpkg install glfw3:x64-windows freetype:x64-windows capstone:x64-windows zstd:x64-windows

    # --- MACOS BAĞIMLILIKLARI ---
    - if: startsWith(matrix.os, 'macos')
      name: Install Dependencies (macOS)
      run: brew install pkg-config glfw freetype capstone zstd meson

    # --- DERLEME (PROFILER GUI) ---
    - name: Build Profiler GUI
      run: |
        if ("${{ matrix.os }}" -eq "windows-latest") {
          cmake -B profiler/build -S profiler -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        } else {
          cmake -B profiler/build -S profiler -DCMAKE_BUILD_TYPE=Release
        }
        cmake --build profiler/build --parallel --config Release

    # --- DİĞER ARAÇLARIN DERLENMESİ ---
    # Not: Hızlı olması için sadece profiler'ı bırakabilirsin ama diğerleri de lazım dersen devam:
    - name: Build Utilities
      run: |
        cmake -B capture/build -S capture -DCMAKE_BUILD_TYPE=Release
        cmake --build capture/build --parallel --config Release

    # --- ARTIFACTS TOPLAMA (EXE'LERİ AYIKLAMA) ---
    - name: Organize Artifacts
      shell: bash
      run: |
        mkdir -p bin
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          cp profiler/build/Release/*.exe bin/ 2>/dev/null || cp profiler/build/*.exe bin/
          cp capture/build/Release/*.exe bin/ 2>/dev/null || cp capture/build/*.exe bin/
        else
          cp profiler/build/tracy-profiler bin/ 2>/dev/null || true
          cp capture/build/tracy-capture bin/ 2>/dev/null || true
        fi

    - name: Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: Tracy-${{ matrix.os }}
        path: bin/
